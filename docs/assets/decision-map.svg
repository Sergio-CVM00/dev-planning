<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<title id="title">A planning decision map</title><desc id="desc">A new feature raises what to plan first. Define the flow is selected before sketching a screen, with the reason retained. Who can access remains an open question.</desc>
<rect width="900" height="340" rx="16" fill="#0d1d2b"/><g font-family="DejaVu Sans, Arial, sans-serif">
<text x="28" y="31" fill="#e4b86b" font-size="11" letter-spacing="2">DEV PLANNING · CONCEPTUAL DECISION MAP</text>
<text x="28" y="55" fill="#f0e9d6" font-size="18" font-weight="600">Keep the next question visible</text>
<g opacity="1.000"><rect x="28" y="133" width="130" height="70" rx="12" fill="#152939" stroke="#527487" stroke-width="1.5"/><text x="42" y="161" fill="#f0e9d6" font-size="16" font-weight="600">New feature</text><text x="42" y="183" fill="#a9bec8" font-size="12">Start from intent</text></g><path d="M158 168 H198" fill="none" stroke="#527487" stroke-width="2" opacity="1.000"/><g opacity="1.000"><rect x="198" y="133" width="190" height="70" rx="12" fill="#152939" stroke="#527487" stroke-width="1.5"/><text x="212" y="161" fill="#f0e9d6" font-size="16" font-weight="600">What comes first?</text><text x="212" y="183" fill="#a9bec8" font-size="12">A planning decision</text></g><path d="M388 168 C410 168 412 106 436 106" fill="none" stroke="#e4b86b" stroke-width="2" opacity="1.000"/><path d="M388 168 C410 168 412 230 436 230" fill="none" stroke="#527487" stroke-width="2" stroke-dasharray="5 5" opacity="1.000"/><g opacity="1.000"><rect x="436" y="71" width="166" height="70" rx="12" fill="#152939" stroke="#e4b86b" stroke-width="1.5"/><text x="450" y="99" fill="#f0e9d6" font-size="16" font-weight="600">Define the flow</text><text x="450" y="121" fill="#a9bec8" font-size="12">Agree behavior first</text></g><g opacity="1.000"><rect x="436" y="195" width="166" height="70" rx="12" fill="#152939" stroke="#796e6b" stroke-width="1.5"/><text x="450" y="223" fill="#f0e9d6" font-size="16" font-weight="600">Sketch a screen</text><text x="450" y="245" fill="#a9bec8" font-size="12">Wait for the flow</text></g><path d="M602 106 H652" fill="none" stroke="#e4b86b" stroke-width="2" opacity="1.000"/><g opacity="1.000"><rect x="652" y="71" width="220" height="70" rx="12" fill="#152939" stroke="#e4b86b" stroke-width="1.5"/><text x="666" y="99" fill="#f0e9d6" font-size="16" font-weight="600">Flow first</text><text x="666" y="121" fill="#a9bec8" font-size="12">Reason: behavior before layout</text></g><path d="M762 141 V195" fill="none" stroke="#527487" stroke-width="2" stroke-dasharray="5 5" opacity="1.000"/><g opacity="1.000"><rect x="652" y="195" width="220" height="70" rx="12" fill="#152939" stroke="#63c3c8" stroke-width="1.5"/><text x="666" y="223" fill="#f0e9d6" font-size="16" font-weight="600">Who can access?</text><text x="666" y="245" fill="#a9bec8" font-size="12">Open question: roles and scope</text></g><g opacity="1.000"><path d="M583 204 l10 10 M593 204 l-10 10" stroke="#c58f7c" stroke-width="2"/></g>
<text x="28" y="309" fill="#a9bec8" font-size="12">Question → alternatives → decision + reason → next uncertainty</text>
<circle cx="688" cy="307" r="4" fill="#e4b86b"/><text x="700" y="311" fill="#a9bec8" font-size="11">Decided</text>
<circle cx="775" cy="307" r="4" fill="#63c3c8"/><text x="787" y="311" fill="#a9bec8" font-size="11">Open</text>
</g></svg>